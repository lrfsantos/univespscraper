<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>UNIVESP Study Tool</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 24px; background: #f5f6f8; color: #1a1a2e; }
    h1 { font-size: 22px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-top: 12px; }
    button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 6px; background: #2b6cb0; color: #fff; cursor: pointer; margin-top: 8px; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    button.primary { background: #2f9e44; }
    label { display: block; padding: 4px 0; cursor: pointer; }
    #log { font-family: Consolas, monospace; font-size: 12px; background: #111; color: #7dff9b; padding: 12px; border-radius: 6px; min-height: 120px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
    .step { margin: 2px 0; }
    .ok { color: #2f9e44; } .fail { color: #e03131; }
    .hidden { display: none; }
    .badge { background: #edf2f7; border-radius: 4px; padding: 2px 6px; font-size: 12px; margin-left: 6px; }
    #status { font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>UNIVESP Study Tool</h1>
  <div class="card">
    <p id="env">Carregando...</p>
    <button id="start">Abrir navegador e fazer login manual</button>
    <p><small>Uma janela do navegador será aberta. Conclua o login manualmente no AVA.</small></p>
  </div>

  <div class="card hidden" id="courseCard">
    <h2>Disciplinas encontradas</h2>
    <div id="courses"></div>
    <button id="nextWeeks">Avançar para semanas</button>
  </div>

  <div class="card hidden" id="weekCard">
    <h2>Seleção de semanas</h2>
    <div id="weeks"></div>
    <p><small>Todas as semanas selecionadas por padrão; desmarque as que não deseja.</small></p>
    <button id="run" class="primary">Extrair materiais</button>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>Resultado</h2>
    <div id="status"></div>
    <div id="summary"></div>
    <button id="saveZip">Escolher destino e gerar ZIP</button>
    <button id="reveal" class="hidden">Abrir pasta do ZIP</button>
    <div id="zipInfo"></div>
  </div>

  <div class="card"><div id="log"></div></div>

  <script>
    const logEl = document.getElementById('log');
    const $ = (id) => document.getElementById(id);
    function addLine(text, cls) {
      const d = document.createElement('div');
      d.className = 'step ' + (cls || '');
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    let courses = [];
    let weeksByCourse = {};
    let selectedCourses = new Set();

    async function init() {
      const env = await window.api.getEnv();
      $('env').textContent = `Versão: ${env.appVersion} | Empacotado: ${env.packaged}`;
      window.api.onStatus((s) => {
        let txt = JSON.stringify(s);
        if (s.step === 'aguardando-login') txt = 'Aguardando login manual...';
        if (s.step === 'disciplinas-descobertas') txt = 'Disciplinas descobertas: ' + s.count;
        addLine(txt, s.ok === false ? 'fail' : (s.ok ? 'ok' : ''));
      });
    }

    async function start() {
      $('start').disabled = true;
      addLine('Abrindo navegador...');
      await window.api.launchBrowser();
      addLine('Navegador aberto. Aguardando login manual no AVA...');
      const r = await window.api.discoverCourses();
      if (r.error) {
        addLine(r.message || r.error, 'fail');
        $('start').disabled = false;
        return;
      }
      courses = r.courses || [];
      if (!courses.length) { addLine('Nenhuma disciplina encontrada.', 'fail'); $('start').disabled = false; return; }
      renderCourses();
      $('courseCard').classList.remove('hidden');
      addLine('Disciplinas: ' + courses.map((c) => c.code || c.id).join(', '));
    }

    function renderCourses() {
      const box = $('courses');
      box.innerHTML = '';
      for (const c of courses) {
        const l = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = c.available !== false;
        cb.disabled = c.available === false;
        cb.dataset.id = String(c.id);
        const title = (c.available === false ? ' (indisponível)' : '');
        l.appendChild(cb);
        l.appendChild(document.createTextNode(` ${c.code || ''} — ${c.title}${title}`));
        box.appendChild(l);
      }
    }

    async function nextWeeks() {
      selectedCourses = new Set();
      document.querySelectorAll('#courses input:checked').forEach((cb) => selectedCourses.add(cb.dataset.id));
      if (!selectedCourses.size) { addLine('Selecione ao menos uma disciplina.', 'fail'); return; }
      addLine('Descobrindo semanas...');
      const r = await window.api.discoverWeeks([...selectedCourses]);
      if (r.error) { addLine(r.error, 'fail'); return; }
      weeksByCourse = r.weeksByCourse || {};
      renderWeeks();
      $('courseCard').classList.add('hidden');
      $('weekCard').classList.remove('hidden');
    }

    function renderWeeks() {
      const box = $('weeks');
      box.innerHTML = '';
      for (const id of Object.keys(weeksByCourse)) {
        const { course, weeks } = weeksByCourse[id];
        const h = document.createElement('h3');
        h.textContent = `${course.code || course.id} — ${course.title}`;
        box.appendChild(h);
        if (!weeks.length) { box.appendChild(document.createTextNode('Nenhuma semana detectada.')); continue; }
        for (const w of weeks) {
          const l = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = true;
          cb.dataset.course = id;
          cb.dataset.week = String(w.id);
          l.appendChild(cb);
          l.appendChild(document.createTextNode(` ${w.name}`));
          box.appendChild(l);
        }
      }
    }

    async function runExtraction() {
      const selection = [];
      for (const courseId of Object.keys(weeksByCourse)) {
        const weekIds = [];
        document.querySelectorAll(`#weeks input[data-course="${courseId}"]:checked`).forEach((cb) => weekIds.push(cb.dataset.week));
        selection.push({ courseId, weekIds });
      }
      $('run').disabled = true;
      addLine('Extraindo materiais (Módulos 1–3)... isso pode levar alguns minutos.');
      const r = await window.api.runExtraction(selection);
      if (!r.ok) { addLine('Extração falhou: ' + (r.error || ''), 'fail'); $('run').disabled = false; return; }
      addLine('Extração concluída. ' + r.resourceCount + ' recurso(s) processados.');
      $('resultCard').classList.remove('hidden');
      $('weekCard').classList.add('hidden');
      $('status').textContent = 'Pronto para gerar o ZIP.';
    }

    async function saveZip() {
      $('saveZip').disabled = true;
      addLine('Escolha o destino do ZIP...');
      const r = await window.api.saveZip();
      if (!r.ok) {
        if (r.canceled) { addLine('Cancelado pelo usuário.', 'fail'); }
        else addLine('Falha ao gerar ZIP: ' + (r.error || ''), 'fail');
        $('saveZip').disabled = false;
        return;
      }
      const v = r.validation || {};
      const okTxt = v.valid ? 'ZIP válido' : 'ZIP inválido';
      $('status').textContent = `Status: ${r.status} — ${okTxt}`;
      $('summary').textContent = `Arquivo: ${r.zip.path}\nTamanho: ${r.zip.bytes} bytes | Entradas: ${v.entries}`;
      addLine(`ZIP criado: ${r.zip.path} (${r.zip.bytes} bytes)`, 'ok');
      $('reveal').classList.remove('hidden');
      $('reveal').onclick = () => window.api.revealZip(r.zip.path);
    }

    $('start').addEventListener('click', start);
    $('nextWeeks').addEventListener('click', nextWeeks);
    $('run').addEventListener('click', runExtraction);
    $('saveZip').addEventListener('click', saveZip);
    init();
  </script>
</body>
</html>
