name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Suíte determinística apenas: sem credenciais, sem AVA, sem VitalSource,
      # sem testes live, sem materiais acadêmicos.
      - run: npm test
